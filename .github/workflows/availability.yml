name: Synchronisation des disponibilités

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

concurrency:
  group: availability-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'LAPLAGNESTAY/laplagnestay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Générer uniquement les dates publiques
        run: node scripts/sync.mjs
        env:
          ICAL_HAMEAUX: ${{ secrets.ICAL_HAMEAUX }}
          ICAL_ASPEN_STUDIO: ${{ secrets.ICAL_ASPEN_STUDIO }}
          ICAL_ASPEN_ENTIER: ${{ secrets.ICAL_ASPEN_ENTIER }}
          ICAL_ASPEN_COLOC1: ${{ secrets.ICAL_ASPEN_COLOC1 }}
          ICAL_ASPEN_COLOC2: ${{ secrets.ICAL_ASPEN_COLOC2 }}
      - name: Publier le fichier JSON
        run: |
          if git diff --quiet -- data/availability.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/availability.json
          git commit -m 'Actualiser les disponibilités'
          git push origin HEAD:main
